<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Редактор PDF — Obiimy</title>

<!-- The page of src/deck-editor.py. The deck's own CSS is loaded into the first <style> as is: the pages below are the very
     HTML that Chrome prints, so what is seen here is what the PDF gets. Everything of the editor is prefixed ed- / data-ed-. -->
<style id="ed-deck-css"></style>
<style>
html, body { height: 100%; overflow: hidden; }
body { display: grid; grid-template: "top top top" 46px "ctx ctx ctx" 38px "rail work lib" minmax(0, 1fr) / 300px minmax(0, 1fr) auto; }
[hidden] { display: none !important; }
.ed-ui { font: 400 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; color: #22241f; letter-spacing: 0; text-transform: none; font-variant-numeric: normal; text-align: left; white-space: normal; }
.ed-ui button, .ed-ui input { font: inherit; color: inherit; }
.ed-ui button { height: 28px; padding: 0 10px; border: 1px solid #d3d3ce; border-radius: 6px; background: #fff; cursor: pointer; white-space: nowrap; }
.ed-ui button:hover:not(:disabled) { background: #f1f1ee; }
.ed-ui button:disabled { opacity: .4; cursor: default; }
.ed-ui button.ed-primary { background: #22241f; border-color: #22241f; color: #fff; font-weight: 600; }
.ed-ui button.ed-primary:hover:not(:disabled) { background: #3a3d36; }
.ed-ui button.ed-quiet { border-color: transparent; background: transparent; }
.ed-ui button.ed-quiet:hover:not(:disabled) { background: #e9e9e5; }
.ed-ui a.ed-link { color: #2459c9; text-decoration: underline; cursor: pointer; }
.ed-ui input[type=text], .ed-ui input[type=search] { height: 30px; padding: 0 9px; border: 1px solid #d3d3ce; border-radius: 6px; background: #fff; width: 100%; }
.ed-muted { color: #70726c; }

#ed-top { grid-area: top; display: flex; align-items: center; gap: 8px; padding: 0 12px; background: #fbfbf9; border-bottom: 1px solid #dcdcd8; }
#ed-top .ed-name { font-weight: 600; margin-right: 10px; white-space: nowrap; }
#ed-top .ed-sep { width: 1px; height: 22px; background: #dcdcd8; margin: 0 4px; }
#ed-top .ed-grow { flex: 1; }
#ed-zoom { min-width: 44px; text-align: center; font-variant-numeric: tabular-nums; }
#ed-state { white-space: nowrap; }
#ed-state.ed-dirty { color: #8a5a00; }

#ed-ctx { grid-area: ctx; display: flex; align-items: center; gap: 6px; padding: 0 12px; background: #f3f3f0; border-bottom: 1px solid #dcdcd8; overflow: hidden; white-space: nowrap; }
#ed-ctx .ed-crumbs { display: flex; align-items: center; gap: 2px; min-width: 0; overflow: hidden; flex: none; }
#ed-ctx .ed-crumb { height: 24px; padding: 0 7px; border: 0; background: transparent; border-radius: 5px; }
#ed-ctx .ed-crumb:last-child { background: #dfe8fb; color: #1d4bb0; font-weight: 600; }
#ed-ctx .ed-crumb span { color: #8d8f89; font-weight: 400; margin-left: 4px; }
#ed-ctx .ed-arrow { color: #a2a49e; }
#ed-ctx .ed-read { margin-left: 8px; color: #55574f; font-variant-numeric: tabular-nums; }
#ed-ctx .ed-hint { color: #70726c; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
#ed-ctx .ed-grow { flex: 1; min-width: 8px; }
#ed-ctx .ed-add { display: flex; gap: 6px; flex: none; margin-left: 8px; padding-left: 10px; border-left: 1px solid #dcdcd8; }
#ed-ctx button { height: 26px; }
#ed-work.ed-placing { cursor: crosshair; }
#ed-work.ed-placing #ed-flow .pg { cursor: crosshair; }

#ed-rail { grid-area: rail; display: flex; flex-direction: column; min-height: 0; background: #fbfbf9; border-right: 1px solid #dcdcd8; }
#ed-rail .ed-rail-head { padding: 10px 12px 8px; font-weight: 600; border-bottom: 1px solid #ecece8; }
#ed-rail .ed-rail-head span { font-weight: 400; color: #70726c; }
#ed-pages { flex: 1; overflow-y: auto; padding: 6px; position: relative; }
.ed-item { display: grid; grid-template-columns: 104px 1fr; gap: 0 10px; padding: 7px 8px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; touch-action: none; }
.ed-item:hover { background: #f1f1ee; }
.ed-item.ed-on { background: #eef2fb; border-color: #c9d6f3; }
.ed-item.ed-dragging { opacity: .25; }
.ed-item.ed-off .ed-thumb { opacity: .4; }
.ed-item.ed-off .ed-name, .ed-item.ed-off .ed-pid, .ed-item.ed-off .ed-num { opacity: .5; }
.ed-thumb { width: 104px; height: 74px; overflow: hidden; border-radius: 3px; background: #e6e6e2; box-shadow: 0 0 0 1px rgba(0,0,0,.12); pointer-events: none; }
.ed-thumb-in { width: 297mm; height: 210mm; transform: scale(.0927); transform-origin: 0 0; }
.ed-thumb-in .pg { page-break-after: auto; break-after: auto; }
.ed-item-body { min-width: 0; align-self: start; }
.ed-item-top { display: flex; align-items: baseline; gap: 6px; }
.ed-num { font-variant-numeric: tabular-nums; color: #70726c; flex: none; }
.ed-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.ed-dot { width: 7px; height: 7px; border-radius: 50%; background: #2f6feb; align-self: center; margin-left: auto; flex: none; }
.ed-pid { font-size: 11px; color: #8d8f89; font-family: ui-monospace, Menlo, monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ed-badges { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.ed-badges:empty { display: none; }
.ed-badge { font-size: 11px; line-height: 16px; padding: 0 6px; border-radius: 8px; background: #ecece8; color: #55574f; white-space: nowrap; }
.ed-badge.ed-b-mod { background: #fbefd0; color: #7a5200; }
.ed-badge.ed-b-stale { background: #fde6e2; color: #9a2b1c; }
.ed-badge.ed-b-reset { background: #e3f1e4; color: #23602a; }
.ed-badge.ed-b-copy { background: #e4ecfb; color: #1d4bb0; }
.ed-acts { grid-column: 1 / -1; display: none; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
.ed-item.ed-on .ed-acts, .ed-item:hover .ed-acts { display: flex; }
.ed-ui.ed-acts button { height: 23px; padding: 0 7px; font-size: 12px; border-radius: 5px; }
.ed-drop-line { position: absolute; left: 10px; right: 10px; height: 3px; border-radius: 2px; background: #2f6feb; pointer-events: none; z-index: 3; }
.ed-ghost { position: fixed; z-index: 200; pointer-events: none; opacity: .9; background: #fff; box-shadow: 0 6px 24px rgba(0,0,0,.25); border-color: #c9d6f3; }
#ed-rail .ed-rail-foot { padding: 8px 12px; border-top: 1px solid #ecece8; font-size: 12px; color: #70726c; }

#ed-work { grid-area: work; position: relative; overflow: auto; background: #d6d6d2; }
#ed-flow { padding: 14px 28px 60px; min-width: min-content; }
.ed-slot { margin: 0 auto 22px; }
.ed-slot-head { display: flex; align-items: center; gap: 8px; height: 24px; font-size: 12px; color: #55574f; }
.ed-slot-head b { font-weight: 600; color: #22241f; }
.ed-slot-head i { font-style: normal; font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: #8d8f89; }
.ed-paper { position: relative; box-shadow: 0 1px 5px rgba(0,0,0,.22); background: #fff; }
.ed-scale { width: 297mm; height: 210mm; transform-origin: 0 0; }
.ed-slot[data-ed-off] .ed-scale { opacity: .3; }
.ed-slot[data-ed-off] .ed-paper { box-shadow: 0 0 0 1px rgba(0,0,0,.15); background: repeating-linear-gradient(135deg, #e4e4e0 0 10px, #dadad6 10px 20px); }
#ed-flow .pg { user-select: none; -webkit-user-select: none; cursor: default; }
#ed-flow .pg a { cursor: default; }
#ed-flow .pg img { -webkit-user-drag: none; }
.pg [data-ed-hidden] { display: none !important; }
#ed-flow .pg [contenteditable], #ed-flow .pg [contenteditable] * { user-select: text; -webkit-user-select: text; cursor: text; }
#ed-flow .pg [contenteditable] { outline: .45mm solid #2f6feb; outline-offset: .7mm; caret-color: #2f6feb; }

#ed-over { position: absolute; left: 0; top: 0; width: 0; height: 0; z-index: 20; pointer-events: none; }
.ed-box { position: absolute; box-sizing: border-box; border: 1.5px solid #2f6feb; pointer-events: none; }
.ed-box.ed-hover { border: 1px dashed rgba(47,111,235,.75); }
.ed-h { position: absolute; width: 11px; height: 11px; background: #fff; border: 1.5px solid #2f6feb; border-radius: 2px; pointer-events: auto; }
.ed-h[data-c=nw] { left: -7px; top: -7px; cursor: nwse-resize; } .ed-h[data-c=se] { right: -7px; bottom: -7px; cursor: nwse-resize; }
.ed-h[data-c=ne] { right: -7px; top: -7px; cursor: nesw-resize; } .ed-h[data-c=sw] { left: -7px; bottom: -7px; cursor: nesw-resize; }
.ed-tag { position: absolute; left: -1.5px; top: 100%; margin-top: 5px; background: #2f6feb; color: #fff; font-size: 11px; line-height: 17px; padding: 0 6px; border-radius: 3px; white-space: nowrap; font-variant-numeric: tabular-nums; }
#ed-shield { position: absolute; left: 0; top: 0; pointer-events: auto; cursor: default; }
#ed-ghost { position: absolute; opacity: .3; pointer-events: none; max-width: none; }
#ed-cropframe { position: absolute; box-sizing: border-box; border: 1.5px solid #fff; box-shadow: 0 0 0 1.5px #2f6feb; pointer-events: auto; cursor: grab; }
#ed-cropframe:active { cursor: grabbing; }
#ed-cropbar { position: absolute; display: flex; align-items: center; gap: 8px; padding: 6px 8px; background: #fff; border: 1px solid #cfcfca; border-radius: 9px; box-shadow: 0 4px 16px rgba(0,0,0,.2); pointer-events: auto; white-space: nowrap; }
#ed-cropbar input[type=range] { width: 130px; }
#ed-cropbar .ed-warn { color: #9a2b1c; }

#ed-lib { grid-area: lib; width: 336px; display: flex; flex-direction: column; min-height: 0; background: #fbfbf9; border-left: 1px solid #dcdcd8; }
#ed-lib .ed-lib-head { display: flex; align-items: center; padding: 8px 8px 8px 12px; font-weight: 600; border-bottom: 1px solid #ecece8; }
#ed-lib .ed-lib-head span { flex: 1; }
#ed-lib .ed-lib-tools { padding: 10px 12px; display: grid; gap: 8px; border-bottom: 1px solid #ecece8; }
#ed-drop { border: 1.5px dashed #c3c3be; border-radius: 8px; padding: 9px 10px; display: flex; align-items: center; gap: 8px; font-size: 12px; color: #55574f; }
#ed-drop.ed-over-drop, #ed-lib.ed-over-drop #ed-drop { border-color: #2f6feb; background: #eef2fb; }
#ed-groups { display: flex; flex-wrap: wrap; gap: 4px; }
.ed-ui #ed-groups button { height: 24px; padding: 0 8px; font-size: 12px; border-radius: 12px; }
.ed-ui #ed-groups button.ed-on { background: #22241f; border-color: #22241f; color: #fff; }
#ed-grid { flex: 1; overflow-y: auto; padding: 10px 12px 20px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; align-content: start; }
.ed-pic { cursor: pointer; min-width: 0; }
.ed-pic div { aspect-ratio: 1; border-radius: 6px; overflow: hidden; background: #e6e6e2 repeating-conic-gradient(#dcdcd8 0 25%, #ecece8 0 50%) 0 0 / 14px 14px; border: 1px solid #dcdcd8; }
.ed-pic img { width: 100%; height: 100%; object-fit: contain; display: block; }
.ed-pic:hover div { border-color: #2f6feb; box-shadow: 0 0 0 1.5px #2f6feb; }
.ed-pic span { display: block; font-size: 10.5px; line-height: 13px; color: #70726c; margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#ed-grid .ed-note { grid-column: 1 / -1; font-size: 12px; color: #70726c; padding: 6px 0; }

#ed-dlg { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: rgba(30,30,28,.38); }
#ed-dlg .ed-card { width: min(580px, calc(100vw - 40px)); max-height: calc(100vh - 60px); overflow: auto; background: #fff; border-radius: 12px; padding: 22px 24px 18px; box-shadow: 0 12px 48px rgba(0,0,0,.3); }
#ed-dlg h3 { font: 600 17px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; margin-bottom: 8px; letter-spacing: 0; }
#ed-dlg p { margin-bottom: 8px; }
#ed-dlg label { display: block; margin: 10px 0 4px; color: #55574f; font-size: 12px; }
#ed-dlg ul { margin: 4px 0 10px 18px; }
#ed-dlg li { margin-bottom: 4px; }
#ed-dlg pre { font: 11px/1.45 ui-monospace, Menlo, monospace; background: #f3f3f0; border-radius: 6px; padding: 8px 10px; max-height: 200px; overflow: auto; white-space: pre-wrap; margin: 6px 0 10px; }
#ed-dlg summary { cursor: pointer; color: #70726c; margin-bottom: 4px; }
#ed-dlg .ed-row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
#ed-dlg .ed-good { color: #23602a; font-weight: 600; }
#ed-dlg .ed-bad { color: #9a2b1c; font-weight: 600; }
#ed-dlg .ed-steps { list-style: none; margin: 10px 0 4px; padding: 0; }
#ed-dlg .ed-steps li { display: grid; grid-template-columns: 22px 1fr auto; gap: 0 8px; align-items: baseline; padding: 4px 0; border-top: 1px solid #f0f0ed; }
#ed-dlg .ed-steps li small { grid-column: 2 / -1; font-size: 11px; color: #8d8f89; font-family: ui-monospace, Menlo, monospace; white-space: pre-wrap; word-break: break-word; }
#ed-dlg .ed-steps .ed-st { text-align: center; }
#ed-dlg .ed-steps .ed-sec { color: #8d8f89; font-variant-numeric: tabular-nums; }
#ed-bar { height: 4px; border-radius: 2px; background: #ecece8; overflow: hidden; margin: 12px 0 8px; }
#ed-bar i { display: block; height: 100%; width: 0; background: #2f6feb; transition: width 1s linear; }
#ed-toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 120; background: #22241f; color: #fff; padding: 9px 14px; border-radius: 8px; box-shadow: 0 6px 24px rgba(0,0,0,.3); display: flex; gap: 12px; align-items: center; max-width: min(720px, calc(100vw - 40px)); }
#ed-toast a { color: #b9cdfa; text-decoration: underline; cursor: pointer; white-space: nowrap; }
</style>
</head>
<body>
<header id="ed-top" class="ed-ui">
  <span class="ed-name">Редактор PDF</span>
  <button id="ed-zout" class="ed-quiet" title="Мельче">−</button><span id="ed-zoom">100 %</span><button id="ed-zin" class="ed-quiet" title="Крупнее">+</button>

      <button id="ed-czout" class="ed-quiet" title="Отдалить">−</button><input id="ed-cz" type="range" min="0" max="1000" value="0" title="Приблизить или отдалить"><button id="ed-czin" class="ed-quiet" title="Приблизить">+</button>
      <button id="ed-cfill" title="Картинка заполняет рамку целиком">Заполнить</button>

<script>
'use strict';
(() => {
const MM = 96 / 25.4, PW = 297, PH = 210, THUMB = 104 / (PW * MM);
const BLANK = 'data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==';
const DRAFT = 'deck-editor-draft-v2';
const INERT = document.implementation.createHTMLDocument('');      // clones made here do not load their pictures
const $ = s => document.querySelector(s);
const work = $('#ed-work'), flow = $('#ed-flow'), selBox = $('#ed-selbox'), hoverBox = $('#ed-hoverbox'), rail = $('#ed-pages');
const S = { pages: [], info: {}, sec: {}, slot: {}, thumb: {}, cur: {}, title: {}, names: {}, loadedClean: {}, genClean: {}, order: [], hidden: new Set(), loadedOrder: [], loadedHidden: [],
  copies: {}, removed: new Set(), dirty: new Set(), resetOrder: false, hasOrder: false, crops: {}, made: new Set(), zoom: 1, fit: true, active: null, sel: null, hover: null, edit: null, crop: null, drag: null, place: null,
  undo: [], redo: [], busy: false, pdf: null, livePdf: '', lib: { open: false, mode: 'replace', files: null, groups: [], group: '', q: '', fresh: [] } };
window.deckEditor = S;                                             // for a look from the console

// ---------- small things ----------
function h(tag, props, ...kids) {
  const n = document.createElement(tag);
  for (const k in props || {}) {
    const v = props[k];
    if (v == null || v === false) continue;
    if (k === 'class') n.className = v; else if (k === 'text') n.textContent = v; else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else if (k === 'dataset') Object.assign(n.dataset, v); else n.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) n.append(c);
  return n;
}
const num = (v, d = 1) => v.toFixed(d).replace('.', ',').replace('-', '−');
const plural = (n, a, b, c) => (n % 10 === 1 && n % 100 !== 11) ? a : (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 12 || n % 100 > 14)) ? b : c;
function hash(s) { let a = 2166136261; for (let i = 0; i < s.length; i++) { a ^= s.charCodeAt(i); a = Math.imul(a, 16777619); } return (a >>> 0).toString(36) + '.' + s.length; }
async function api(url, opt) {
  let r, data = null;
  try { r = await fetch(url, opt); } catch (e) { throw new Error('Редактор не отвечает. Проверьте, что он запущен: python3 src/deck-editor.py'); }
  try { data = await r.json(); } catch (e) { /* not JSON */ }
  if (!r.ok || !data || data.ok === false) { const err = new Error(data && data.error || 'Ошибка ' + r.status); err.data = data; throw err; }
  return data;
}
const post = (url, body, method) => api(url, { method: method || 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
let toastTimer = 0;
function toast(text, action, fn, ms) {
  const t = $('#ed-toast'); t.textContent = ''; t.append(h('span', { text }));
  if (action) t.append(h('a', { text: action, onclick: () => { t.hidden = true; fn(); } }));
  t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, ms || (action ? 12000 : 4200));
}
function nameOf(pid) {
  if (!pid) return ''; if (S.names[pid]) return S.names[pid];
  const m = /^(.*?)-copy(\d*)$/.exec(pid); if (m) return nameOf(m[1]) + ' (копия' + (m[2] ? ' ' + m[2] : '') + ')';
  return pid;
}

// ---------- pages: parse, clean, compare ----------
function parsePage(html) { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; }
function clean(sec) {
  // what goes into the edits file: the page without anything of the editor (data-pid, data-src and the mark of a hidden element stay)
  const c = INERT.importNode(sec, true);
  for (const n of [c, ...c.querySelectorAll('*')]) {
    for (const a of [...n.attributes]) if (a.name === 'contenteditable' || a.name === 'spellcheck' || (a.name.startsWith('data-ed-') && a.name !== 'data-ed-hidden')) n.removeAttribute(a.name);
    if (n.getAttribute('style') === '') n.removeAttribute('style');
  }
  return c.outerHTML.replace(/&nbsp;/g, ' ');             // the build looks for real no-break spaces when it renumbers pages

    if (st.running) { if (!$('#ed-dlg').hidden && list.isConnected) show(st); }
    else finish(st);
  };
  poll(); pubTimer = setInterval(poll, 2000);
}

// ---------- draft: unsaved work survives a reload ----------
let draftTimer = 0;
function draftSoon() { clearTimeout(draftTimer); draftTimer = setTimeout(draftSave, 350); }
function draftSave() {
  try {
    if (!isDirty()) { localStorage.removeItem(DRAFT); return; }
    const d = { t: Date.now(), pages: {}, copies: {}, removed: [...S.removed], order: orderChanged() ? S.order : null, hidden: [...S.hidden], hiddenFrom: S.loadedHidden.slice().sort().join('|'), resetOrder: S.resetOrder };
    for (const pid of S.dirty) d.pages[pid] = { html: S.cur[pid], from: S.loadedClean[pid] == null ? null : hash(S.loadedClean[pid]) };
    for (const pid in S.copies) if (S.loadedClean[pid] == null) d.copies[pid] = { origin: S.copies[pid], html: S.cur[pid], index: S.order.indexOf(pid) };
    localStorage.setItem(DRAFT, JSON.stringify(d));
  } catch (e) { /* storage is full or closed: the work is still on the screen */ }
}
function draftClear() { clearTimeout(draftTimer); try { localStorage.removeItem(DRAFT); } catch (e) { /* nothing to clear */ } }
function draftApply() {
  let d; try { d = JSON.parse(localStorage.getItem(DRAFT) || 'null'); } catch (e) { d = null; }
  if (!d) return '';
  let n = 0, old = 0; const what = [];
  for (const pid in d.pages || {}) {
    if (!S.sec[pid] || S.loadedClean[pid] == null || hash(S.loadedClean[pid]) !== d.pages[pid].from) { if (!(d.copies || {})[pid]) old++; continue; }      // the page has changed on disk since: the draft of it is void
    const neu = parsePage(d.pages[pid].html); S.sec[pid].replaceWith(neu); S.sec[pid] = neu; S.cur[pid] = clean(neu); S.title[pid] = titleOf(neu); thumbNow(pid);
    if (S.cur[pid] !== S.loadedClean[pid]) { S.dirty.add(pid); n++; }
  }
  for (const pid in d.copies || {}) {
    const c = d.copies[pid]; if (S.sec[pid] || !S.sec[c.origin] && !S.info[c.origin]) continue;
    addCopy({ pid, origin: c.origin, html: c.html, index: Math.min(c.index, S.order.length) }); n++;
  }
  for (const pid of d.removed || []) if (S.sec[pid] && isCopy(pid)) dropCopy(pid);
  if (n) what.push(n + ' ' + plural(n, 'страница', 'страницы', 'страниц'));
  if (d.order && d.order.length === S.order.length && d.order.every(p => S.sec[p])) { S.order = d.order.slice(); if (orderChanged()) what.push('порядок'); }
  if (d.hiddenFrom === S.loadedHidden.slice().sort().join('|')) { S.hidden = new Set((d.hidden || []).filter(p => S.sec[p])); if (hiddenChanged()) what.push('скрытые страницы'); }
  if (d.resetOrder && S.hasOrder) S.resetOrder = true;
  if (old) setTimeout(() => toast('Часть черновика (' + old + ' стр.) устарела: эти страницы с тех пор пересобраны.'), 400);
  return what.join(', ');
}

// ---------- keys ----------
function onKey(e) {
  const mod = e.metaKey || e.ctrlKey, t = e.target, inField = t && t.closest && t.closest('input, textarea, select') && !S.edit;
  if (!$('#ed-dlg').hidden) { if (e.key === 'Escape' && !S.busy) dlg(null); return; }
  if (mod && e.code === 'KeyS') { e.preventDefault(); save(); return; }
  if (inField) { if (e.key === 'Escape') t.blur(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && t && t.closest && t.closest('button, a, summary') && !S.edit) return;      // the key presses that control
  if (S.edit) {
    if (e.key === 'Escape') { e.preventDefault(); endEdit(); }
    else if (e.key === 'Enter') { e.preventDefault(); if (mod) endEdit(); else insertBreak(); }
    return;                                                    // everything else is ordinary typing, with the browser's own undo
  }
  if (S.crop) {
    if (e.key === 'Escape') { e.preventDefault(); cropEnd(false); } else if (e.key === 'Enter') { e.preventDefault(); cropEnd(true); }
    else if (mod && e.code === 'KeyZ') { e.preventDefault(); cropEnd(false); }
    return;
  }
  if (S.place) { if (e.key === 'Escape') placeEnd(); return; }
  if (mod && e.code === 'KeyZ') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && e.code === 'KeyY') { e.preventDefault(); redo(); return; }
  if (mod || e.altKey) return;
  if (e.key === 'Escape') { if (S.sel) select(S.sel.parentElement); else if (S.lib.open) libClose(); return; }
  if (!S.sel) return;
  const step = e.shiftKey ? 1 : .25, arrows = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] };
  if (arrows[e.key]) { e.preventDefault(); nudge(...arrows[e.key]); }
  else if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); hideSel(); }
  else if (e.key === 'Enter') { e.preventDefault(); if (S.sel.tagName === 'IMG') cropStart(S.sel); else if (ownsText(S.sel)) startEdit(S.sel); }
}

// ---------- wiring ----------
let layTimer = 0;
function layoutSoon() { cancelAnimationFrame(layTimer); layTimer = requestAnimationFrame(layout); }
function wire() {
  work.addEventListener('pointerdown', onDown); work.addEventListener('pointermove', onMove); work.addEventListener('pointerup', onUp); work.addEventListener('pointercancel', onUp);
  work.addEventListener('pointerleave', () => { if (!S.drag) S.hover = null; });
  work.addEventListener('dblclick', e => {
    if (S.crop || S.busy || S.place || e.target.closest('.ed-ui')) return;
    if (S.edit && S.edit.el.contains(e.target)) return;
    const x = e.clientX, y = e.clientY, t = textOwnerAt(x, y);
    if (t) { startEdit(t, x, y); return; }
    const p = pick(x, y); if (p && p.tagName === 'IMG') { select(p); cropStart(p); }
  });
  flow.addEventListener('click', e => { if (e.target.closest('a')) e.preventDefault(); });
  flow.addEventListener('paste', onPaste);
  work.addEventListener('scroll', () => {
    if (S.drag) return;
    const mid = work.scrollTop + work.clientHeight * .4; let best = null;
    for (const pid of S.order) { const s = S.slot[pid]; if (s.offsetTop <= mid) best = pid; else break; }
    if (best) setActive(best);
  }, { passive: true });
  work.addEventListener('wheel', e => { if ((e.ctrlKey || e.metaKey) && !S.crop) { e.preventDefault(); setZoom(S.zoom * Math.exp(-e.deltaY * .01)); } }, { passive: false });   // pinch on a trackpad
  window.addEventListener('keydown', onKey);
  window.addEventListener('resize', layoutSoon);
  window.addEventListener('beforeunload', e => { draftSave(); if (isDirty()) { e.preventDefault(); e.returnValue = ''; } });
  $('#ed-zin').onclick = () => setZoom(S.zoom * 1.15); $('#ed-zout').onclick = () => setZoom(S.zoom / 1.15); $('#ed-zfit').onclick = () => { S.fit = true; layout(); };
  $('#ed-undo').onclick = undo; $('#ed-redo').onclick = redo; $('#ed-save').onclick = () => save(); $('#ed-publish').onclick = publishAsk;
  $('#ed-libx').onclick = libClose; $('#ed-upbtn').onclick = () => $('#ed-file').click();
  $('#ed-file').onchange = e => { upload(e.target.files); e.target.value = ''; };
  $('#ed-q').oninput = e => { S.lib.q = e.target.value; libDraw(); };
  cropWire(); dropWire(); railWire(); requestAnimationFrame(frame);
}
wire();
load().catch(e => dlg(h('h3', { class: 'ed-bad', text: 'Редактор не открылся' }), h('p', { text: e.message }), h('div', { class: 'ed-row' }, h('button', { class: 'ed-primary', text: 'Попробовать ещё раз', onclick: () => location.reload() }))));
})();
</script>
